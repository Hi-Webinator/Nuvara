<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#db4444" />

    <!-- Primary meta -->
    <title>Nuvara — Luxury Ecommerce Store</title>
    <meta
      name="description"
      content="Nuvara — Premium luxury ecommerce store offering exclusive fragrances, skincare, and beauty essentials. Shop the finest curated collections delivered worldwide."
    />
    <meta name="author" content="Hi Webinator" />
    <meta
      name="keywords"
      content="luxury ecommerce, premium fragrances, skincare, beauty, perfumes, luxury store, online shopping, exclusive collections"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://nuvara.com/" />

    <!-- Performance: warm up the Google Fonts connection used by the stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Nuvara" />
    <meta property="og:title" content="Nuvara — Luxury Ecommerce Store" />
    <meta
      property="og:description"
      content="Discover our curated selection of premium fragrances, skincare, and beauty essentials crafted for those who demand the finest."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nuvara.com" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nuvara — Luxury Ecommerce Store" />
    <meta
      name="twitter:description"
      content="Discover our curated selection of premium fragrances, skincare, and beauty essentials."
    />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>
